# libfprint's egisqsee drives the sensor through two device nodes fprintd's
# sandbox does not allow: the Egis sensor's power, reset and interrupt
# control, and the QSEECom TEE client device the fingerprint TA is reached
# through. The TA has to be loaded before fprintd opens the sensor; the
# loader only reports ready once it is, and fprintd may be activated early,
# by the lock screen.
[Unit]
Wants=qsee-app-loader@egisap64.service
After=qsee-app-loader@egisap64.service

[Service]
DeviceAllow=/dev/egisfp0 rw
DeviceAllow=char-tee rw
