# Read by hexagonrpcd's hexagonrpcd-adsp-sensorspd init script. Without it
# hexagonrpcd guesses /usr/share/qcom/{soc}/{vendor}/{codename} from the
# device tree, which here gives sm6450/Sony/pdx246, and the files are under
# columbia, the board name the firmware paths use.
hexagonrpcd_fw_dir="/usr/share/qcom/sm6450/Sony/columbia"
