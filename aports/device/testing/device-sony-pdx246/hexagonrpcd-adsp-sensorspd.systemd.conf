[Unit]
# ExecStartPre waits for FastRPC; checking its existence before that would
# skip the service permanently when udev is still loading the ADSP.
ConditionPathExists=
ConditionPathExists=!/dev/fastrpc-sdsp

[Service]
ExecStartPre=+/usr/libexec/device-sony-pdx246/hexagonrpcd-adsp-fresh
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /usr/share/qcom/sm6450/Sony/columbia
