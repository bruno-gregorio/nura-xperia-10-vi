# Installed as /usr/lib/kernel-cmdline.d/50-device-sony-pdx246.conf and read by
# generate-kernel-cmdline, whose output boot-deploy puts in the vendor_boot
# cmdline. The 50- prefix sorts after postmarketos-base's 00-base.conf, which
# contributes "quiet" - so loglevel=7 here is the one that takes effect.
#
# Do NOT set deviceinfo_kernel_cmdline as well. boot-deploy's get_cmdline()
# treats the two as alternatives, not as things to merge:
#
#     if [ -n "$deviceinfo_kernel_cmdline" ]; then
#             _ret="$deviceinfo_kernel_cmdline $deviceinfo_kernel_cmdline_append"
#     else
#             _ret="$(generate-kernel-cmdline)"
#     fi
#
# so a deviceinfo setting silently discards every drop-in, this file included.
#
# The stock Android cmdline is deliberately not reused: its
# "video=vfb:640x400,bpp=32" would register a virtual framebuffer that claims
# /dev/fb0 before the real panel, and its androidboot.* keys only mean
# something to Android's init.

# Being able to see what happened on a device with no display driver yet.
# earlycon takes no argument because the bootloader writes
# stdout-path = "/soc/qcom,qup_uart@98c000:115200n8" into /chosen - not
# parrot.dtb, which does not define it at the root and never did; confirmed
# against the harvested live tree, where it sits beside linux,initrd-start.
# It is picked up before the driver registers, and works with msm_geni_serial
# left as a module because Qualcomm builds the early console as its own
# always-builtin object. See pmos.config.
console=ttyMSM0,115200n8
earlycon
loglevel=7
printk.devkmsg=on

# Bring-up only; drop this line once the device boots on its own. It stops the
# boot in the initramfs rather than continuing into a userspace that has no
# display driver to draw on. The shell brings up the USB gadget and listens on
# telnet 172.16.42.1:23 and a CDC-ACM port, so a first boot can be inspected
# over the USB-C cable with no hardware modification at all; from there
# 'pmos_logdump' hands dmesg over as a USB mass-storage volume and
# 'pmos_continue_boot' carries on booting.
pmos.debug-shell

# Bring-up only, and the thing that makes a failed boot recoverable without
# touching the phone. A kernel that panics otherwise sits there forever, and
# the only way back to fastboot is the Power+VolUp combo by hand. With these
# two, a panic resets the device instead, the bootloader's A/B retry counter
# runs down, and after seven attempts it marks the slot unbootable and falls
# back to the other one - which is why the experiment goes on the inactive
# slot and the stock images stay on the active one. See scripts/try-kernel.sh.
#
# This does nothing for a true hang: if the kernel stops without panicking,
# nothing resets it. Only a crash becomes hands-free.
panic=5
panic_on_oops=1
