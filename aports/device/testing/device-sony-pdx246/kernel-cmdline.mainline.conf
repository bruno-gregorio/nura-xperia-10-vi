# Installed as /usr/lib/kernel-cmdline.d/50-device-sony-pdx246.conf and read by
# generate-kernel-cmdline, whose output boot-deploy puts in the vendor_boot
# cmdline. The 50- prefix sorts after postmarketos-base's 00-base.conf, which
# contributes "quiet" - so loglevel=7 here is the one that takes effect.
#
# Do NOT set deviceinfo_kernel_cmdline as well. boot-deploy's get_cmdline()
# treats the two as alternatives, not as things to merge, so a deviceinfo
# setting silently discards every drop-in, this file included. See
# kernel-cmdline.downstream.conf for the code.
#
# This boots the whole system. scripts/try-kernel.sh edits the line in the
# vendor_boot header for each round instead of rebuilding: rounds other than
# FULLBOOT=1 add pmos.debug-shell, and CMDLINE_ADD and CMDLINE_DEL try
# anything else. What turns out to matter comes back here.

# The console. The bootloader writes stdout-path =
# "/soc/qcom,qup_uart@98c000:115200n8" into /chosen, a path that exists in the
# stock tree and not in ours, which calls the node
# /soc@0/geniqup@9c0000/serial@98c000. If it overwrites the stdout-path our
# board file sets, a bare "earlycon" finds no console and prints nothing,
# silently. So name the register block outright: mmio32 because the geni
# earlycon drives it with readl/writel, and 0x98c000 because that is uart3's
# reg in sm6450.dtsi.
console=ttyMSM0,115200n8
earlycon=qcom_geni,mmio32,0x98c000
loglevel=7
printk.devkmsg=on

# Three passes turn off whatever no driver has claimed, from
# late_initcall_sync: clk_disable_unused, genpd_power_off_unused and, 30 s
# later, regulator_init_complete. What they would turn off includes clocks,
# domains and supplies that TZ, the modem or the bootloader's display still
# use while no driver here holds a vote for them, and losing those is a
# hardware reset rather than a crash the kernel can report. This is the
# documented bring-up workaround upstream. Drop them one at a time, each with
# a round that shows the boot survives it.
clk_ignore_unused
pd_ignore_unused
regulator_ignore_unused

# A panic resets the phone instead of leaving it hung, and through the
# bootloader's A/B retry counter a kernel that keeps panicking falls back to
# the other slot after seven attempts. 60 and not 5, because with no console
# the length of an attempt is what tells a panic from a hardware reset: the
# panic waits this long and a reset waits for nothing. See
# scripts/try-kernel.sh.
#
# Not oops=panic, on purpose. An oops that does not panic lets the kernel
# carry on, and a kernel that reaches userspace can still hand over its log.
# (panic_on_oops=1 is not a kernel parameter at all, which is why it is not
# here either.)
panic=60
