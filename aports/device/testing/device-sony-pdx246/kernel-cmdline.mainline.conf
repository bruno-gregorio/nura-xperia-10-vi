# Installed as /usr/lib/kernel-cmdline.d/50-device-sony-pdx246.conf and read by
# generate-kernel-cmdline, whose output boot-deploy puts in the vendor_boot
# cmdline. The 50- prefix sorts after postmarketos-base's 00-base.conf, which
# contributes "quiet" - so loglevel=7 here is the one that takes effect.
#
# Do NOT set deviceinfo_kernel_cmdline as well. boot-deploy's get_cmdline()
# treats the two as alternatives, not as things to merge, so a deviceinfo
# setting silently discards every drop-in, this file included. See
# kernel-cmdline.downstream.conf for the code.

# Being able to see what happened on a device with no display driver yet.
#
# The downstream file can get away with a bare "earlycon", because the
# bootloader writes stdout-path = "/soc/qcom,qup_uart@98c000:115200n8" into
# /chosen and that path exists in the stock tree. It does not exist in ours -
# our node is /soc@0/geniqup@9c0000/serial@98c000 - so if the bootloader
# overwrites the stdout-path our board file sets, of_stdout comes back NULL
# and a bare earlycon does nothing at all, silently, which is the worst
# possible failure for the one thing we have to watch the boot with.
#
# So name the register block outright. mmio32 because the geni earlycon in
# drivers/tty/serial/qcom_geni_serial.c drives it with readl/writel, and
# 0x98c000 because that is uart3's reg in sm6450.dtsi - the same address the
# bootloader's own stdout-path names, checked against the live tree.
console=ttyMSM0,115200n8
earlycon=qcom_geni,mmio32,0x98c000
loglevel=7
printk.devkmsg=on

# Keeping the chip alive long enough to reach the initramfs.
#
# Three subsystems tear down anything nobody claimed, all three from
# late_initcall_sync - which is to say after every driver has probed but
# before /init runs. On a SoC this young almost nothing is claimed, so what
# they tear down is most of the chip, including clocks and domains that TZ,
# the modem and the bootloader's own live display are still using. Turning
# those off is not a crash the kernel can report; it is a hardware reset.
#
#     drivers/clk/clk.c:1558          clk_disable_unused
#     drivers/pmdomain/core.c:1392    genpd_power_off_unused
#     drivers/regulator/core.c:6631   regulator_init_complete
#
# The first two run the moment late_initcall_sync is reached, the third 30s
# later (msecs_to_jiffies(30000) in regulator_init_complete).
#
# These were flashed on 2026-10-06 as the explanation for a silent reset loop
# and they are not it: the device behaved identically, falling back after the
# same 158 seconds as the round before. Whatever kills this kernel happens
# before late_initcall_sync, so none of the three passes had run yet. They
# stay anyway, because they are the right thing for a tree this young
# regardless of today's bug - every one of these votes is missing only
# because the driver that should hold it does not exist yet - and because the
# regulator pass guards a death the kernel has not yet lived long enough to
# reach. Do not read them as a fix for anything observed.
#
# All three are the documented bring-up workaround upstream, not a trick:
# "we need to use these two kernel command line arguments (clk_ignore_unused
# & pd_ignore_unused) to skip disabling clocks and genpd power domains as
# part of late init for initial version". Drop them one at a time, late, once
# the drivers that should be holding these votes exist.
clk_ignore_unused
pd_ignore_unused
regulator_ignore_unused

# Bring-up only; drop this line once the device boots on its own. It stops the
# boot in the initramfs rather than continuing into a userspace that has no
# display driver to draw on - mainline has no dispcc, DPU or panel driver for
# this SoC yet, so there is even less to see than downstream. The shell brings
# up the USB gadget and listens on telnet 172.16.42.1:23 and a CDC-ACM port,
# so a first boot can be inspected over the USB-C cable; from there
# 'pmos_logdump' hands dmesg over as a USB mass-storage volume and
# 'pmos_continue_boot' carries on booting.
pmos.debug-shell

# Bring-up only, and the thing that makes a failed boot recoverable without
# touching the phone. A kernel that panics otherwise sits there forever, and
# the only way back to fastboot is the Power+VolUp combo by hand. With these
# two, a panic resets the device instead, the bootloader's A/B retry counter
# runs down, and after seven attempts it marks the slot unbootable and falls
# back to the other one - which is why the experiment goes on the inactive
# slot and the stock images stay on the active one. See scripts/try-kernel.sh.
#
# This does nothing for a true hang: if the kernel stops without panicking,
# nothing resets it. Only a crash becomes hands-free. That matters more here
# than downstream: this is the first boot of a device tree nobody has booted,
# and the likeliest outcome is a hang in a driver's probe.
#
# The timeout is 60 and not 5 on purpose, and it is the current experiment
# rather than a setting. With no console at all, a panic and a hardware reset
# look the same from the host: the device just reboots. But they are not the
# same, and they point opposite ways - a panic means the kernel is alive and
# its reporting machinery works, a silent hardware reset means a bad register
# access, the watchdog, or TZ. The one thing that separates them is already
# here: panic_timeout waits this many seconds before rebooting
# (kernel/panic.c:558), and a hardware reset waits for nothing. So the value
# is an output channel one number wide. At 5 the two were indistinguishable;
# at 60 a panicking kernel takes 55s longer per attempt, and the seven
# attempts the bootloader allows multiply that into 385s - a fallback at
# around 543s instead of 158s. Put it back to 5 once the question is settled.
panic=60
panic_on_oops=1
