# MultiMedia1 is the headphone stream, MultiMedia2 the speaker's and
# MultiMedia3 the microphones', as the topology lays them out.
SectionVerb {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='QUINARY_MI2S_RX Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='QUINARY_MI2S_RX Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	Include.wcdhpe.File "/codecs/wcd937x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd937x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

# The microphones all go through decimator 0 into MultiMedia3, one at a
# time. The device tree routes ADC1 to SoundWire input SWR_MIC0 and ADC2 to
# SWR_MIC4. The decimator stays at unity, as stock has it; the ADCs' gain
# is set once, in the card's boot sequence. Neither is offered to the sound
# server as a volume: the ADC gain controls claim 0.25 dB a step, where on
# this codec a step is worth over 1 dB.
#
# AMIC1, on ADC1, is stock's handset and speakerphone microphone.
SectionDevice."Mic1" {
	Comment "Main Microphone"

	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
	}
}

# AMIC2 is the headset microphone, on ADC2 through its INP2 input.
SectionDevice."Mic2" {
	Comment "Headset Microphone"

	Include.wcdmice.File "/codecs/wcd937x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd937x/HeadphoneMicDisableSeq.conf"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},2"
		JackControl "Mic Jack"
		JackHWMute "Mic1 Mic3"
	}
}

# AMIC3, on ADC2 through its INP3 input, is stock's second handset
# microphone. It hears the top amplifier's speaker 20 dB louder than AMIC1
# does, so it sits at the top.
SectionDevice."Mic3" {
	Comment "Top Microphone"

	EnableSequence [
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2 Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 MUX' INP2"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}
