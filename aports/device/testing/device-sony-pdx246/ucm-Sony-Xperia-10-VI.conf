Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm6450/Sony-Xperia-10-VI/HiFi.conf"
	Comment "HiFi quality Music"
}

# The amplifier's level is fixed here, 6 dB under stock's profile, and the
# sound server's own volume works on top of it: with no speaker protection
# running on the DSP, nothing should be able to drive the speaker past what
# stock's profile allows. The microphone ADCs start at their top step,
# where the sound server's full volume puts them.
BootSequence [
	cset "name='Top PCM Playback Volume' 336"
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC1 Volume' 20"
	cset "name='ADC2 Volume' 20"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd937x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
