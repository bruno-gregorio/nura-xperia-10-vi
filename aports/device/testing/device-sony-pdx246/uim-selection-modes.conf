[Service]
# The modem's stored preference allows only GSM and UMTS. Android's RIL sets
# the preferred network type on every boot, and rmtfs -r keeps whatever the
# modem stores from outliving one, so set all four here: after the SIM is
# selected, before ModemManager reads the modes.
ExecStartPost=-/usr/bin/qmicli --silent -pd qrtr://0 --nas-set-system-selection-preference=gsm|umts|lte|5gnr
